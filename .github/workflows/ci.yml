name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install pyyaml numpy pytest
      - name: Knowledge base is valid and generated files are current
        run: python scripts/build_kb.py --check
      - name: Python tests
        run: pytest -q clm/tests
      - name: JavaScript tests
        run: node --test tests/search-core.test.mjs tests/infonce.test.mjs
