  practices: [none]
  modalities: [behavior]
  topics: [attention-residue, interruptions, implementation-intentions]
  summary: >
    Four studies: expecting time pressure when returning to an interrupted task increases
    residue and lowers performance on the interrupting task. Briefly planning the return
    ("ready-to-resume") removes the effect, a simple intervention comparable to the
    disengage-and-return step trained in meditation.

