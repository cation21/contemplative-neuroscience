- id: leroy-2018-tasks-interrupted
  title: "Tasks Interrupted: How Anticipating Time Pressure on Resumption of an Interrupted Task Causes Attention Residue and Low Performance on Interrupting Tasks and How a \"Ready-to-Resume\" Plan Mitigates the Effects"
  authors: "Leroy S, Glomb TM"
  year: 2018
