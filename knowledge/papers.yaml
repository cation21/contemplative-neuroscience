- id: fox-2016-functional-meta
  title: "Functional neuroanatomy of meditation: A review and meta-analysis of 78 functional neuroimaging investigations"
  authors: "Fox KCR, et al."
  year: 2016
  venue: Neuroscience & Biobehavioral Reviews
  doi: 10.1016/j.neubiorev.2016.03.021
  verified: true
  type: meta-analysis
  practices: [focused-attention, open-monitoring, compassion, mantra]
