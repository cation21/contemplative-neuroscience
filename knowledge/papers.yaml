  year: 2011
  venue: "Psychiatry Research: Neuroimaging"
  doi: 10.1016/j.pscychresns.2010.08.006
  verified: true
  type: empirical
  practices: [mindfulness-program]
  modalities: [sMRI]
  topics: [gray-matter, MBSR, hippocampus, longitudinal]
