  year: 2005
  venue: NeuroReport
  doi: 10.1097/01.wnr.0000186598.66243.19
  verified: true
  type: empirical
  practices: [open-monitoring]
  modalities: [sMRI]
  topics: [cortical-thickness, insula, cross-sectional]
