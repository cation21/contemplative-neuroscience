  year: 2017
  venue: Science Advances
  doi: 10.1126/sciadv.1700489
  verified: true
  type: empirical
  practices: [focused-attention, compassion, mixed]
  modalities: [sMRI]
  topics: [ReSource, cortical-thickness, longitudinal, social-cognition]
