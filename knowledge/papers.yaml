# Curated papers in contemplative neuroscience.
#
# Fields
#   id            short unique slug (firstauthor-year-keyword)
#   title         exact published title
#   authors       first author + "et al." (full lists come from the corpus build)
#   year, venue
#   doi | arxiv | url   at least one identifier
#   verified      true when the identifier was checked against a live source while curating;
#                 false entries are checked by scripts/verify_dois.py in CI
#   type          empirical | review | meta-analysis | theory | methods | dataset | tool
#   practices     focused-attention | open-monitoring | compassion | non-dual | mindfulness-program
#                 | advanced | mantra | mixed | none
#   modalities    EEG | MEG | fMRI | sMRI | NIBS | physiology | behavior | computational | none
#   topics        free tags
#   summary       one or two sentences in our own words (not the abstract)

papers:

# ---------- Foundations and frameworks ----------
- id: lutz-2008-attention-regulation
  title: "Attention regulation and monitoring in meditation"
  authors: "Lutz A, et al."
  year: 2008
  venue: Trends in Cognitive Sciences
  doi: 10.1016/j.tics.2008.01.005
  verified: true
  type: theory
  practices: [focused-attention, open-monitoring]
  modalities: [none]
  topics: [taxonomy, attention, meta-awareness]
  summary: >
    Introduces the focused-attention versus open-monitoring distinction that most later
    studies use to classify meditation styles, and links each to attention networks.

- id: dahl-2015-self
  title: "Reconstructing and deconstructing the self: cognitive mechanisms in meditation practice"
  authors: "Dahl CJ, et al."
  year: 2015
  venue: Trends in Cognitive Sciences
  doi: 10.1016/j.tics.2015.07.001
  verified: true
  type: theory
  practices: [focused-attention, open-monitoring, compassion, non-dual]
  modalities: [none]
  topics: [taxonomy, self, attentional-constructive-deconstructive]
  summary: >
    Proposes three families of practice (attentional, constructive, deconstructive) organised
    around how they change self-related processing.

- id: dahl-2020-plasticity-wellbeing
  title: "The plasticity of well-being: A training-based framework for the cultivation of human flourishing"
  authors: "Dahl CJ, et al."
  year: 2020
  venue: PNAS
  doi: 10.1073/pnas.2014859117
  verified: true
  type: theory
  practices: [mixed]
  modalities: [none]
  topics: [well-being, awareness, connection, insight, purpose]
  summary: >
    Frames well-being as trainable skills (awareness, connection, insight, purpose) and maps
    each onto candidate neural and psychological mechanisms.

- id: tang-2015-neuroscience-mindfulness
  title: "The neuroscience of mindfulness meditation"
  authors: "Tang YY, et al."
  year: 2015
  venue: Nature Reviews Neuroscience
  doi: 10.1038/nrn3916
  verified: true
  type: review
  practices: [mindfulness-program, mixed]
  modalities: [fMRI, sMRI, EEG]
  topics: [attention, emotion-regulation, self-awareness, overview]
  summary: >
    Widely cited overview of attention control, emotion regulation and self-awareness as the
    three components through which mindfulness is thought to act on the brain.

- id: holzel-2011-mechanisms
  title: "How does mindfulness meditation work? Proposing mechanisms of action from a conceptual and neural perspective"
  authors: "Hölzel BK, et al."
  year: 2011
  venue: Perspectives on Psychological Science
  doi: 10.1177/1745691611419671
  verified: true
  type: theory
  practices: [mindfulness-program]
  modalities: [none]
  topics: [mechanisms, body-awareness, emotion-regulation, self]
  summary: >
    Breaks mindfulness into interacting mechanisms (attention regulation, body awareness,
    emotion regulation, change in self-perspective) with proposed neural substrates.

- id: lutz-2015-phenomenological-matrix
  title: "Investigating the phenomenological matrix of mindfulness-related practices from a neurocognitive perspective"
  authors: "Lutz A, et al."
  year: 2015
  venue: American Psychologist
  doi: 10.1037/a0039585
  verified: true
  type: theory
  practices: [mindfulness-program, focused-attention, open-monitoring, non-dual]
  modalities: [none]
  topics: [phenomenology, meta-awareness, dereification, taxonomy]
  summary: >
    Describes practices as positions in a multidimensional space (object orientation,
    meta-awareness, dereification and others) instead of discrete categories.

- id: laukkonen-2021-many-to-none
  title: "From many to (n)one: Meditation and the plasticity of the predictive mind"
  authors: "Laukkonen RE, Slagter HA"
  year: 2021
  venue: Neuroscience & Biobehavioral Reviews
  doi: 10.1016/j.neubiorev.2021.06.021
  verified: true
  type: theory
  practices: [focused-attention, open-monitoring, non-dual, advanced]
  modalities: [computational]
  topics: [predictive-processing, active-inference, cessation, self]
  summary: >
    Recasts meditation within predictive processing: practice progressively flattens the
    predictive hierarchy, with cessation as the limit case.

- id: sandved-smith-2021-mental-action
  title: "Towards a computational phenomenology of mental action: modelling meta-awareness and attentional control with deep parametric active inference"
  authors: "Sandved-Smith L, et al."
  year: 2021
  venue: Neuroscience of Consciousness
  doi: 10.1093/nc/niab018
  verified: true
  type: theory
  practices: [focused-attention]
  modalities: [computational]
  topics: [active-inference, meta-awareness, mind-wandering, simulation]
  summary: >
    Builds a hierarchical active-inference model in which meta-awareness controls attentional
    precision, and simulates mind-wandering and its correction during breath focus.

- id: van-dam-2018-mind-the-hype
  title: "Mind the hype: A critical evaluation and prescriptive agenda for research on mindfulness and meditation"
  authors: "Van Dam NT, et al."
  year: 2018
  venue: Perspectives on Psychological Science
  doi: 10.1177/1745691617709589
  verified: true
  type: review
  practices: [mindfulness-program]
  modalities: [none]
  topics: [methodology, critique, replication, definitions]
  summary: >
    Critiques weak definitions, small samples and overstated claims in mindfulness research,
    and sets out a methodological agenda for the field.

# ---------- EEG: states, traits and oscillations ----------
- id: lutz-2004-gamma
  title: "Long-term meditators self-induce high-amplitude gamma synchrony during mental practice"
  authors: "Lutz A, et al."
  year: 2004
  venue: PNAS
  doi: 10.1073/pnas.0407401101
  verified: true
  type: empirical
  practices: [compassion, non-dual]
  modalities: [EEG]
  topics: [gamma, long-term-practitioners, synchrony]
  summary: >
    Tibetan Buddhist practitioners generating non-referential compassion showed unusually large
    gamma-band power and synchrony compared with novices.

- id: cahn-2006-states-traits
  title: "Meditation states and traits: EEG, ERP, and neuroimaging studies"
  authors: "Cahn BR, Polich J"
  year: 2006
  venue: Psychological Bulletin
  doi: 10.1037/0033-2909.132.2.180
  verified: true
  type: review
  practices: [mixed]
  modalities: [EEG, fMRI]
  topics: [state-vs-trait, alpha, theta, ERP]
  summary: >
    Classic review separating short-term state effects from long-term trait effects, with
    alpha and theta changes as the most consistent EEG findings at the time.

- id: cahn-2010-vipassana-gamma
  title: "Occipital gamma activation during Vipassana meditation"
  authors: "Cahn BR, et al."
  year: 2010
  venue: Cognitive Processing
  doi: 10.1007/s10339-009-0352-1
  verified: true
  type: empirical
  practices: [open-monitoring]
  modalities: [EEG]
  topics: [gamma, vipassana, long-term-practitioners]
  summary: >
    Long-term Vipassana practitioners showed increased occipital gamma power during
    meditation relative to a control thinking state.

- id: lomas-2015-eeg-review
  title: "A systematic review of the neurophysiology of mindfulness on EEG oscillations"
  authors: "Lomas T, et al."
  year: 2015
  venue: Neuroscience & Biobehavioral Reviews
  doi: 10.1016/j.neubiorev.2015.09.018
  verified: true
  type: review
  practices: [mindfulness-program, mixed]
  modalities: [EEG]
  topics: [alpha, theta, systematic-review]
  summary: >
    Systematic review of EEG oscillation studies; increased alpha and theta are the most
    consistent findings, while gamma and beta results are mixed.

- id: braboszcz-2017-gamma-traditions
  title: "Increased Gamma Brainwave Amplitude Compared to Control in Three Different Meditation Traditions"
  authors: "Braboszcz C, et al."
  year: 2017
  venue: PLOS ONE
  doi: 10.1371/journal.pone.0170647
  verified: true
  type: empirical
  practices: [open-monitoring, focused-attention, mantra]
  modalities: [EEG]
  topics: [gamma, vipassana, himalayan-yoga, isha-shoonya]
  summary: >
    Compared Vipassana, Himalayan Yoga and Isha Shoonya practitioners with controls and found
    higher parieto-occipital gamma across traditions.

- id: brandmeyer-2018-mind-wandering
  title: "Reduced mind wandering in experienced meditators and associated EEG correlates"
  authors: "Brandmeyer T, Delorme A"
  year: 2018
  venue: Experimental Brain Research
  doi: 10.1007/s00221-016-4811-5
  verified: true
  type: empirical
  practices: [focused-attention, open-monitoring]
  modalities: [EEG]
  topics: [mind-wandering, frontal-midline-theta, experience-sampling, open-data]
  summary: >
    Experience-sampling probes during meditation showed experts reported less mind wandering;
    frontal midline theta and somatosensory alpha were higher during meditation than during
    wandering. The data are openly shared (see datasets).

- id: ferrarelli-2013-sleep-gamma
  title: "Experienced mindfulness meditators exhibit higher parietal-occipital EEG gamma activity during NREM sleep"
  authors: "Ferrarelli F, et al."
  year: 2013
  venue: PLOS ONE
  doi: 10.1371/journal.pone.0073417
  verified: true
  type: empirical
  practices: [mixed]
  modalities: [EEG]
  topics: [gamma, sleep, trait]
  summary: >
    Long-term practitioners showed elevated parieto-occipital gamma during NREM sleep,
    suggesting a trait effect that persists outside practice.

- id: berkovich-ohana-2012-gamma-dmn
  title: "Mindfulness-induced changes in gamma band activity – implications for the default mode network, self-reference and attention"
  authors: "Berkovich-Ohana A, et al."
  year: 2012
  venue: Clinical Neurophysiology
  doi: 10.1016/j.clinph.2011.07.048
  verified: true
  type: empirical
  practices: [mindfulness-program]
  modalities: [EEG]
  topics: [gamma, default-mode-network, self-reference]
  summary: >
    Relates practice-related gamma changes in experienced mindfulness meditators to reduced
    default-mode, self-referential activity.

- id: kerr-2013-alpha-body
  title: "Mindfulness starts with the body: somatosensory attention and top-down modulation of cortical alpha rhythms in mindfulness meditation"
  authors: "Kerr CE, et al."
  year: 2013
  venue: Frontiers in Human Neuroscience
  doi: 10.3389/fnhum.2013.00012
  verified: true
  type: theory
  practices: [mindfulness-program]
  modalities: [EEG, MEG]
  topics: [alpha, somatosensory, body-scan, sensory-gating]
  summary: >
    Proposes that early mindfulness training works by sharpening top-down control of
    somatosensory alpha rhythms during body-focused attention.

- id: rodriguez-larios-2022-nonlinear
  title: "Nonlinear EEG signatures of mind wandering during breath focus meditation"
  authors: "Rodriguez-Larios J, et al."
  year: 2022
  venue: Current Research in Neurobiology
  doi: 10.1016/j.crneur.2022.100056
  verified: true
  type: empirical
  practices: [focused-attention]
  modalities: [EEG]
  topics: [mind-wandering, complexity, nonlinear, novices]
  summary: >
    Tests whether nonlinear (complexity) EEG measures distinguish mind wandering from breath
    focus in novice meditators.

- id: aviad-2024-oscillating-mindfully
  title: "Oscillating Mindfully: Using Machine Learning to Characterize Systems-Level Electrophysiological Activity During Focused Attention Meditation"
  authors: "Aviad N, et al."
  year: 2024
  venue: Biological Psychiatry Global Open Science
  doi: 10.1016/j.bpsgos.2024.100423
  verified: true
  type: empirical
  practices: [focused-attention]
  modalities: [EEG]
  topics: [machine-learning, xgboost, feature-importance, mind-wandering]
  summary: >
    Gradient-boosted classifiers with feature-importance analysis separated focused attention
    from mind wandering in 26 experienced meditators, highlighting high-frequency power and
    coherence features.

- id: lin-2025-eeg-mindfulness-methods
  title: "Using Electroencephalography to Advance Mindfulness Science: A Survey of Emerging Methods and Approaches"
  authors: "Lin Y, Atad DA, Zanesco AP"
  year: 2025
  venue: "Biological Psychiatry: Cognitive Neuroscience and Neuroimaging"
  doi: 10.1016/j.bpsc.2024.09.012
  verified: true
  type: review
  practices: [mindfulness-program]
  modalities: [EEG]
  topics: [methods, aperiodic, complexity, microstates, translational]
  summary: >
    Survey of newer EEG analyses for mindfulness research, including separating oscillatory
    from aperiodic activity and complexity measures, with notes on their caveats.

# ---------- fMRI and structural MRI ----------
- id: brefczynski-lewis-2007-attentional-expertise
  title: "Neural correlates of attentional expertise in long-term meditation practitioners"
  authors: "Brefczynski-Lewis JA, et al."
  year: 2007
  venue: PNAS
  doi: 10.1073/pnas.0606552104
  verified: true
  type: empirical
  practices: [focused-attention]
  modalities: [fMRI]
  topics: [attention, expertise, inverted-u]
  summary: >
    Concentration meditation engaged attention networks in an inverted-U relation with
    practice hours: moderate experts showed more activation than novices, the most practised
    showed less.

- id: brewer-2011-dmn
  title: "Meditation experience is associated with differences in default mode network activity and connectivity"
  authors: "Brewer JA, et al."
  year: 2011
  venue: PNAS
  doi: 10.1073/pnas.1112029108
  verified: true
  type: empirical
  practices: [focused-attention, open-monitoring, compassion]
  modalities: [fMRI]
  topics: [default-mode-network, connectivity, mind-wandering]
  summary: >
    Experienced meditators showed lower activity in core default-mode regions across several
    practices, and stronger coupling between posterior cingulate and control regions.

- id: hasenkamp-2012-mind-wandering
  title: "Mind wandering and attention during focused meditation: A fine-grained temporal analysis of fluctuating cognitive states"
  authors: "Hasenkamp W, et al."
  year: 2012
  venue: NeuroImage
  doi: 10.1016/j.neuroimage.2011.07.008
  verified: true
  type: empirical
  practices: [focused-attention]
  modalities: [fMRI]
  topics: [mind-wandering, salience-network, default-mode-network, button-press]
  summary: >
    Participants pressed a button when they noticed mind wandering, revealing a cycle of
    wandering, awareness, shifting and sustained attention with distinct network activity.

- id: garrison-2015-dmn-beyond-task
  title: "Meditation leads to reduced default mode network activity beyond an active task"
  authors: "Garrison KA, et al."
  year: 2015
  venue: "Cognitive, Affective, & Behavioral Neuroscience"
  doi: 10.3758/s13415-015-0358-3
  verified: true
  type: empirical
  practices: [mixed]
  modalities: [fMRI]
  topics: [default-mode-network, active-baseline]
  summary: >
    Compared with an active cognitive task baseline, meditation still reduced activity in
    default-mode regions such as posterior cingulate cortex.

- id: farb-2007-self-reference
  title: "Attending to the present: mindfulness meditation reveals distinct neural modes of self-reference"
  authors: "Farb NAS, et al."
  year: 2007
  venue: Social Cognitive and Affective Neuroscience
  doi: 10.1093/scan/nsm030
  verified: true
  type: empirical
  practices: [mindfulness-program]
  modalities: [fMRI]
  topics: [self-reference, narrative-vs-experiential, insula]
  summary: >
    After mindfulness training, experiential (moment-to-moment) self-focus shifted activity
    away from medial prefrontal narrative regions toward lateral and insular regions.

- id: lutz-2008-compassion-emotion
  title: "Regulation of the neural circuitry of emotion by compassion meditation: effects of meditative expertise"
  authors: "Lutz A, et al."
  year: 2008
  venue: PLOS ONE
  doi: 10.1371/journal.pone.0001897
  verified: true
  type: empirical
  practices: [compassion]
  modalities: [fMRI]
  topics: [compassion, insula, emotional-sounds, expertise]
  summary: >
    During compassion meditation, experts showed stronger insula and cingulate responses to
    emotional vocal sounds than novices.

- id: weng-2013-compassion-altruism
  title: "Compassion training alters altruism and neural responses to suffering"
  authors: "Weng HY, et al."
  year: 2013
  venue: Psychological Science
  doi: 10.1177/0956797612469537
  verified: true
  type: empirical
  practices: [compassion]
  modalities: [fMRI, behavior]
  topics: [compassion, altruism, training-study]
  summary: >
    Two weeks of compassion training increased altruistic redistribution in an economic game,
    and this was linked to changed responses to images of suffering.

- id: klimecki-2014-empathy-compassion
  title: "Differential pattern of functional brain plasticity after compassion and empathy training"
  authors: "Klimecki OM, et al."
  year: 2014
  venue: Social Cognitive and Affective Neuroscience
  doi: 10.1093/scan/nst060
  verified: true
  type: empirical
  practices: [compassion]
  modalities: [fMRI]
  topics: [empathy, compassion, plasticity, negative-affect]
  summary: >
    Empathy training increased negative affect and related activity, while subsequent
    compassion training raised positive affect and engaged reward-related regions.

- id: weng-2020-breath-decoding
  title: "Focus on the breath: Brain decoding reveals internal states of attention during meditation"
  authors: "Weng HY, et al."
  year: 2020
  venue: Frontiers in Human Neuroscience
  doi: 10.3389/fnhum.2020.00336
  verified: true
  type: empirical
  practices: [focused-attention]
  modalities: [fMRI]
  topics: [decoding, machine-learning, attention-states]
  summary: >
    Trained brain-pattern classifiers on attention tasks and applied them to meditation to
