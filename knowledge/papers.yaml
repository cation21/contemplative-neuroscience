  year: 2014
  venue: Neuroscience & Biobehavioral Reviews
  doi: 10.1016/j.neubiorev.2014.03.016
  verified: true
  type: meta-analysis
  practices: [mixed]
  modalities: [sMRI]
  topics: [morphometry, publication-bias, insula]
